name: release

# Runs GoReleaser when a semver tag is pushed (the tag `relio` creates locally,
# then `git push --follow-tags`). It builds the binaries, packages archives,
# writes checksums.txt, creates the GitHub Release with all assets, and pushes
# an updated Formula/relio.rb to Soyagvs/homebrew-tap.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # create the GitHub Release + upload assets in THIS repo

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags for the changelog

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Tests
        run: go test ./...

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          # Provided automatically — scoped to THIS repo (release + assets).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A PAT you create with write access to Soyagvs/homebrew-tap.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
